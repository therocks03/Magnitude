<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Editor | Magnitude Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* EXACT STYLES FROM INDEX.HTML */
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --red:#C0392B;--red2:#E74C3C;--red-light:#FDECEC;
      --green:#27AE60;--green-light:#E8F8EF;
      --gold:#D4A017;--gold-light:#FFF8E7;
      --dark:#1A0A0A;--text:#2C1A1A;--text2:#6B4F4F;
      --bg:#FFFAF8;--white:#FFFFFF;--border:#F0DADA;
    }
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;font-size:15px}

    /* NAV STYLES */
    nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 5%}
    .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1400px;margin:0 auto}
    .nav-logo img{height:48px;width:auto;object-fit:contain}
    .nav-links{display:flex;gap:4px;list-style:none;align-items:center;margin:0;padding:0}
    .nav-item{position:relative}
    .nav-item>a{color:var(--text);text-decoration:none;font-size:14px;font-weight:500;padding:10px 18px;display:inline-flex;align-items:center;gap:6px;border-radius:6px;transition:all .2s;cursor:pointer}
    .nav-item>a:hover{color:var(--red);background:var(--red-light)}
    .dropdown-arrow{font-size:9px;transition:transform .2s;margin-left:2px}
    .nav-item:hover .dropdown-arrow{transform:rotate(180deg)}
    .nav-item .dropdown{visibility:hidden;opacity:0;position:absolute;top:100%;left:0;margin-top:8px;background:var(--white);border:1px solid var(--border);border-radius:12px;min-width:280px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,0.12);z-index:9999;pointer-events:none;transition:opacity 0.2s, visibility 0.2s}
    .nav-item:hover > .dropdown{visibility:visible;opacity:1;pointer-events:auto}
    .dropdown a{display:block;padding:11px 14px;color:var(--text);text-decoration:none;font-size:13.5px;font-weight:500;border-radius:8px;transition:all .2s;white-space:nowrap;line-height:1.4}
    .dropdown a:hover{background:var(--red-light);color:var(--red);transform:translateX(3px)}
    .dropdown-divider{height:1px;background:var(--border);margin:10px 6px}
    .nav-right{display:flex;align-items:center;gap:20px;flex-shrink:0}
    .nav-phone{font-size:14px;color:var(--text);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:6px;transition:color .2s;padding:8px 12px;border-radius:6px}
    .nav-phone:hover{color:var(--red);background:var(--red-light)}
    .nav-cta{background:var(--red);color:#fff;padding:11px 26px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;transition:all .25s;white-space:nowrap;box-shadow:0 2px 8px rgba(192,57,43,0.2)}
    .nav-cta:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 4px 12px rgba(192,57,43,0.3)}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px}
    .hamburger span{width:24px;height:2.5px;background:var(--text);border-radius:2px;transition:.3s}
    .mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;background:var(--white);border-bottom:1px solid var(--border);padding:24px 5%;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,0.08);max-height:calc(100vh - 64px);overflow-y:auto}
    .mobile-menu.open{display:block}
    .mobile-nav-group{margin-bottom:28px}
    .mobile-nav-group-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);font-weight:700;margin-bottom:14px;padding-left:4px;border-bottom:1px solid var(--border);padding-bottom:8px}
    .mobile-menu a{color:var(--text);text-decoration:none;font-size:14.5px;font-weight:500;padding:10px 4px;display:block;transition:all .2s;border-radius:6px}
    .mobile-menu a:hover{color:var(--red);background:var(--red-light);padding-left:12px}

    /* EDITOR SPECIFIC STYLES */
    .editor-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 30px 5%; height: calc(100vh - 140px); }
    .input-side, .preview-side { background: var(--white); border-radius: 16px; border: 1px solid var(--border); padding: 30px; overflow-y: auto; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text2); letter-spacing: 0.5px; }
    input, select, textarea { padding: 12px; border-radius: 8px; border: 1.5px solid var(--border); font-family: inherit; font-size: 14px; outline: none; }
    textarea { height: 400px; resize: none; }
    .btn-save { background: var(--red); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-save:hover { background: var(--red2); transform: translateY(-2px); }
    .preview-header { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .preview-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="footer-logo-wrap"><img src="logo.png" alt="Magnitude Eduventures" style="height:60px;object-fit:contain"></div>
    </a>
    <ul class="nav-links">
      <li class="nav-item"><a href="index.html">Home</a></li>
      <li class="nav-item"><a href="blog.html">Blog</a></li>
    </ul>
    <div class="nav-right">
      <button onclick="savePost()" class="nav-cta">Download & Save blog-data.js</button>
    </div>
  </div>
</nav>

<div class="editor-layout">
  <div class="input-side">
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="post-title" oninput="updatePreview()">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="post-category" onchange="updatePreview()">
        <option>JEE Preparation</option>
        <option>NEET Preparation</option>
        <option>Board Exams</option>
      </select>
    </div>
    <div class="form-group">
      <label>Cover Image URL</label>
      <input type="text" id="post-cover" placeholder="Link to a high-res image (Unsplash, etc.)" oninput="updatePreview()">
    </div>
    <div class="form-group" style="display:none;">
      <label>Admin Password</label>
      <input type="password" id="post-password" value="not-needed">
    </div>
    <div class="form-group">
      <label>Content (Markdown)</label>
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <button type="button" onclick="insertMedia('image')" style="padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:12px;">🖼️ Add Image</button>
        <button type="button" onclick="insertMedia('youtube')" style="padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:12px;">▶️ Add YouTube</button>
        <button type="button" onclick="insertMedia('pdf')" style="padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:12px;">📄 Add PDF</button>
        <button type="button" onclick="insertMedia('link')" style="padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:12px;">🔗 Add Link</button>
      </div>
      <textarea id="post-content" oninput="updatePreview()"></textarea>
    </div>
  </div>
  <div class="preview-side">
    <div class="preview-header">
      <div id="p-cat" style="color:var(--red); font-weight:700; font-size:12px;">CATEGORY</div>
      <h1 id="p-title" class="preview-title">Title Preview</h1>
    </div>
    <div id="p-body"></div>
  </div>
</div>

<script src="blog-data.js"></script>
<script>
  function initEditor() {
    const catSelect = document.getElementById('post-category');
    const categories = getCategories();
    catSelect.innerHTML = categories.map(cat => `<option>${cat}</option>`).join('');
  }

  function updatePreview() {
    document.getElementById('p-title').textContent = document.getElementById('post-title').value || 'Title Preview';
    document.getElementById('p-cat').textContent = document.getElementById('post-category').value;
    const md = document.getElementById('post-content').value;
    document.getElementById('p-body').innerHTML = md
      .replace(/\n\n/g, '</p><p>')
      .replace(/^## (.*$)/gim, '<h2>$1</h2>')
      .replace(/\!\[(.*?)\]\((.*?)\)/gim, '<img src="$2" style="width:100%; border-radius:8px; margin:10px 0;">')
      .replace(/\[(.*?)\]\((.*?)\)/gim, '<a href="$2" target="_blank" style="color:var(--red); text-decoration:underline;">$1</a>');
  }

  function insertMedia(type) {
    const area = document.getElementById('post-content');
    let tag = '';
    if (type === 'image') tag = '![Image Description](https://example.com/image.jpg)';
    if (type === 'youtube') tag = '[youtube](VIDEO_ID_HERE)';
    if (type === 'pdf') tag = '[pdf](https://example.com/document.pdf)';
    if (type === 'link') tag = '[Link Text](https://example.com)';
    
    const start = area.selectionStart;
    const end = area.selectionEnd;
    area.value = area.value.substring(0, start) + tag + area.value.substring(end);
    updatePreview();
  }

  function savePost() {
    const title = document.getElementById('post-title').value;
    const content = document.getElementById('post-content').value;
    const coverImage = document.getElementById('post-cover').value;

    if(!title || !content) return alert('Please fill Title and Content');
    
    const post = {
      id: title.toLowerCase().replace(/[^a-z0-9]/g, '-'),
      title, 
      content, 
      excerpt: content.substring(0, 150) + '...',
      coverImage: coverImage || 'https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&q=80&w=2070',
      author: 'Admin', 
      authorRole: 'Educator',
      category: document.getElementById('post-category').value,
      coverColor: 'var(--red)', 
      date: new Date().toISOString().split('T')[0],
      readTime: Math.ceil(content.split(' ').length / 200),
      featured: false
    };

    // 1. Add to local memory
    const updatedPosts = addBlogPostLocal(post);
    
    // 2. Generate the new file content
    const fileContent = generateDataFileContent(updatedPosts);
    
    // 3. Trigger download
    const blob = new Blob([fileContent], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'blog-data.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    alert('Success! Your updated blog-data.js has been downloaded.\n\nNow replace the old file in your folder with this new one and upload/deploy your site.');
    window.location.href = 'blog.html';
  }

  window.onload = initEditor;
</script>

</body>
</html>
